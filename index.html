<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Prescripción Social | CESFAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --accent: #3498db;
      --bg-body: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --hover: #f1f5f9;
      --selected: #d1ecf1;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-body); 
      margin: 0; 
      padding: 20px; 
      color: var(--text-main);
    }
    
    /* Encabezado */
    .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 40px; }
    
    /* Contenedor de Filtros */
    .filter-container { width: 93.8%; margin: 0 auto; background: var(--surface); padding: 15px; border-radius: 8px; box-shadow: 0 2px 40px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .filter-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; width: 100%; }
    
    /* Buscador Largo */
    #searchInput { flex: 3; min-width: 300px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; outline: none; }
    select { flex: 0.6; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: white; cursor: pointer; }
    
    .btn-print { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-print:hover { background: var(--primary-dark); }

    #active-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; min-height: 25px; }
    .tag { background: var(--accent); color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px; }

    /* Tabla */
    .table-wrapper { width: 95%; margin: 0 auto; background: var(--surface); border-radius: 8px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: var(--primary); color: white; padding: 15px; text-align: left; font-size: 13px; text-transform: uppercase; }
    
    /* Centrar columna de impacto */
    th:nth-child(6), td:nth-child(6) { text-align: center !important; }

    tr { transition: background 0.2s; border-bottom: 1px solid var(--border); }
    tr:hover { background-color: var(--hover); } 
    tr.selected-row { background-color: var(--selected) !important; } 
    td { padding: 12px; vertical-align: top; font-size: 14px; }
    
    .negrita { font-weight: bold; display: block; }
    .secundario { font-size: 12px; color: #64748b; display: block; margin-top: 4px; }
    
    /* Semáforo */
    .circulo { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.1); vertical-align: middle; margin: 0 auto; }
    .bajo { background-color: #2ecc71; }
    .medio { background-color: #f1c40f; }
    .alto { background-color: #e74c3c; }

    .selection-bar { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; padding: 12px 20px; border-radius: 50px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); font-weight: bold; z-index: 100; font-size: 16px; }

    /* ==========================================
       SECCIÓN DE IMPRESIÓN (RECETA)
       ========================================== */
    @media print {
            @page { size: letter; margin: 1cm; }
            header, .container, .floating-bar { display: none !important; }
            body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #print-area { display: block !important; width: 100%; }
            .doc-header { margin-bottom: 30px; border-left: 6px solid var(--primary); padding-left: 15px; }
            .doc-header h2 { margin: 0; font-size: 16pt; color: var(--primary-dark); text-transform: uppercase; }
            .doc-header p { margin: 3px 0 0 0; font-size: 10pt; color: #333; font-weight: 600; text-transform: uppercase; }
            .doc-title { text-align: center; font-size: 13pt; font-weight: 800; border: 2px solid #000; padding: 8px; margin-bottom: 35px; background: #f8fafc; }
            .patient-section { margin-bottom: 45px; } 
            .patient-row { margin-bottom: 18px; display: flex; gap: 20px; font-size: 11pt; }
            .field-full { flex: 1; border-bottom: 1.5px solid #000; padding-bottom: 2px; }
            .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
            .print-card { border: 1.5px solid var(--primary); border-radius: 10px; padding: 15px; background: #fff; page-break-inside: avoid; margin-top: 25px; }
            .print-card h3 { margin: 0 0 5px 0; font-size: 11.5pt; color: var(--primary-dark); border-bottom: 1.5px solid #e2e8f0; padding-bottom: 5px; }
            .provider-name { font-size: 9pt; font-style: italic; color: #555; margin-bottom: 8px; display: block; }
            .data-row { display: flex; font-size: 9.5pt; margin-bottom: 3px; line-height: 1.2; }
            .data-label { font-weight: 700; width: 75px; color: #222; flex-shrink: 0; }
            .footer-section { margin-top: 50px; display: flex; justify-content: center; } 
            .sign-line { border-top: 2px solid #000; width: 280px; text-align: center; padding-top: 8px; font-weight: 700; font-size: 10pt; text-transform: uppercase; }
        }
    }
  </style>
</head>
<body>

<div class="header-app">
  <div class="header-titles">
    <h2 style="margin:0px;">Catálogo de Prescripción Social</h2>
    <p style="margin: 5px 0 0 0; color: #64748b; font-size: 14px;">
      Seleccione hasta 4 actividades para la receta del paciente.
    </p>
  </div>
  <button class="btn-print" onclick="window.print()">Imprimir Receta</button>
</div>

  <div class="filter-container">
    <div class="filter-group">
      <input type="text" id="searchInput" placeholder="Escribe para buscar taller o dirección...">
      <select id="territorioSelect"><option value="">Territorio</option><option value="EEF">EEF</option><option value="AN">AN</option><option value="PPD">PPD</option><option value="LVN">LVN</option></select>
      <select id="categoriaSelect"><option value="">Categoría</option></select>
      <select id="impactoSelect"><option value="">Impacto</option><option value="Bajo">Bajo</option><option value="Medio">Medio</option><option value="Alto">Alto</option></select>
    </div>
    <div id="active-filters"></div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr><th>Sel.</th><th>Actividad</th><th>Horario</th><th>Dirección</th><th>Territorio</th><th>Impacto</th><th>Categoría</th></tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" style="text-align:center; padding: 40px;">Cargando talleres comunitarios...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="selection-bar">Seleccionados: <span id="count">0</span> / 4</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyCayz1gH5MxIxxpdblwWpBqry9Qm3g054G62zQGQcZUmPSW0A1e0b5NoTINMwHzTQyOg/exec";
    
    let allData = [];
    let activeFilters = { territorio: [], categoria: [], impacto: [] };

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        allData = await response.json();
        
        const cats = [...new Set(allData.map(item => item.categoria))].filter(Boolean).sort();
        const catSelect = document.getElementById('categoriaSelect');
        cats.forEach(c => {
          let opt = document.createElement('option');
          opt.value = c; opt.innerText = c;
          catSelect.appendChild(opt);
        });
        renderTable(allData);
      } catch (e) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">Error al cargar datos.</td></tr>';
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      data.forEach((item, index) => {
        const impactoClase = item.impacto ? item.impacto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
        const tr = document.createElement('tr');
        tr.id = `row-${index}`;
        tr.innerHTML = `
          <td style="text-align:center;"><input type="checkbox" onchange="toggleRowSelection(this, '${index}')"></td>
          <td><span class="negrita">${item.actividad || ''}</span></td>
          <td><span class="negrita">${item.dia || ''}</span><span class="secundario">${item.horario || ''}</span></td>
          <td><span>${item.direccion || ''}</span><span class="secundario">Costo: ${item.costo || 'No indicado'}</span></td>
          <td>${item.territorio || ''}</td>
          <td>${item.impacto ? `<div class="circulo ${impactoClase}"></div>` : ''}</td>
          <td>${item.categoria || ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleRowSelection(checkbox, idx) {
      const row = document.getElementById(`row-${idx}`);
      checkbox.checked ? row.classList.add('selected-row') : row.classList.remove('selected-row');
      updateCount();
    }

    function updateCount() {
      const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
      document.getElementById('count').innerText = checked;
    }

    function updateFilters() {
      const searchTxt = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => {
        const textToSearch = (item.actividad + " " + item.direccion + " " + (item.dia || "")).toLowerCase();
        const matchesSearch = textToSearch.includes(searchTxt);
        const matchesTerritorio = activeFilters.territorio.length === 0 || activeFilters.territorio.includes(item.territorio);
        const matchesCategoria = activeFilters.categoria.length === 0 || activeFilters.categoria.includes(item.categoria);
        const matchesImpacto = activeFilters.impacto.length === 0 || activeFilters.impacto.includes(item.impacto);
        return matchesSearch && matchesTerritorio && matchesCategoria && matchesImpacto;
      });
      renderTable(filtered);
      updateTags();
    }

    function updateTags() {
      const container = document.getElementById('active-filters');
      container.innerHTML = '';
      ['territorio', 'categoria', 'impacto'].forEach(type => {
        activeFilters[type].forEach(val => {
          const tag = document.createElement('div');
          tag.className = 'tag';
          tag.innerHTML = `${val} <span style="cursor:pointer" onclick="removeFilter('${type}', '${val}')">×</span>`;
          container.appendChild(tag);
        });
      });
    }

    function removeFilter(type, val) {
      activeFilters[type] = activeFilters[type].filter(v => v !== val);
      updateFilters();
    }

    document.getElementById('searchInput').addEventListener('keyup', updateFilters);
    
    ['territorioSelect', 'categoriaSelect', 'impactoSelect'].forEach(id => {
      document.getElementById(id).addEventListener('change', (e) => {
        const type = id.replace('Select', '');
        if(e.target.value && !activeFilters[type].includes(e.target.value)) {
          activeFilters[type].push(e.target.value);
          updateFilters();
        }
        e.target.value = "";
      });
    });

    loadData();
  </script>
</body>
</html>
